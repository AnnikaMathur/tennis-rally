// ================================================================
// PROJECTION SYSTEM — calibrated to the cropped court image
// ================================================================
var COURT = {
  nearBaselineY: 0.92,
  netY: 0.51,
  farBaselineY: 0.38,
  nearHalfWidth: 0.33,
  farHalfWidth: 0.22,
  netHalfWidth: 0.27,
};

function projectToScreen(worldX, worldDepth, worldY) {
  if (worldY === undefined) worldY = 0;
  var W = canvas.width;
  var H = canvas.height;
  var d = Math.max(0, Math.min(1, worldDepth));

  var screenY;
  if (d <= 0.5) {
    var t = d / 0.5;
    screenY = COURT.nearBaselineY + (COURT.netY - COURT.nearBaselineY) * t;
  } else {
    var t = (d - 0.5) / 0.5;
    screenY = COURT.netY + (COURT.farBaselineY - COURT.netY) * t;
  }
  screenY = screenY * H;

  var halfWidth;
  if (d <= 0.5) {
    var t2 = d / 0.5;
    halfWidth = COURT.nearHalfWidth + (COURT.netHalfWidth - COURT.nearHalfWidth) * t2;
  } else {
    var t2 = (d - 0.5) / 0.5;
    halfWidth = COURT.netHalfWidth + (COURT.farHalfWidth - COURT.netHalfWidth) * t2;
  }
  var screenX = (W / 2) + worldX * halfWidth * W;

  var scale = 1 - d * 0.65;
  var heightOnScreen = worldY * 180 * scale;

  return { x: screenX, y: screenY - heightOnScreen, scale: scale };
}

// ================================================================
// SESSION 2: THE BALL
//
// The ball has 6 properties that define its position and movement:
//   x:      left/right on the court (-1 to +1)
//   y:      height above the ground (0 = on ground)
//   depth:  how far down the court (0 = your end, 1 = far end)
//   vx:     horizontal speed (left/right movement per frame)
//   vy:     vertical speed (up/down, affected by gravity)
//   vDepth: speed toward/away from you (positive = going away)
//
// Every frame, we:
//   1. Add velocity to position (move the ball)
//   2. Apply gravity to vy (pulls the ball down)
//   3. Check if the ball hit the ground (bounce it)
//   4. Check if it reached either end of the court
// ================================================================

// --- PHYSICS CONSTANTS ---
// These control how the ball moves. Tweak these to change game feel.
var GRAVITY = 0.0018;        // How fast the ball falls (higher = faster drop)
var BOUNCE_DAMPING = 0.55;   // Energy kept after bounce (0.55 = loses 45%)
var BALL_RADIUS_BASE = 6;    // Ball size at depth 0 (smaller, more realistic)

// --- THE BALL OBJECT ---
var ball = {
  x: 0,           // Center of court
  y: 0.5,         // Starts slightly above ground
  depth: 0.5,     // Starts at the net
  vx: 0,          // No horizontal movement initially
  vy: 0.04,       // Slight upward arc
  vDepth: -0.012, // Moving toward the player
  active: false,   // Is the ball in play?
  trail: []        // Stores recent positions for the speed trail effect
};

// --- GAME STATE ---
var gameState = 'menu';       // 'menu', 'serving', 'playing', 'missed', 'scored', 'out', 'matchover'
var previousState = 'serving';
var serveTimer = 0;
var rallyCount = 0;
var bestRally = 0;
var paused = false;
var gameTimer = 0;

// ================================================================
// REAL TENNIS SCORING
//
// Points in a game: 0, 15, 30, 40
// If both reach 40: Deuce
// After deuce: Advantage, then Game if they win again
// First to 6 games wins the set (must win by 2)
// At 6-6: Tiebreak (first to 7 points, win by 2)
// We play 1 set per match.
// ================================================================
var tennis = {
  playerPoints: 0,
  opponentPoints: 0,
  playerGames: 0,
  opponentGames: 0,
  isTiebreak: false,
  playerTBPoints: 0,
  opponentTBPoints: 0,
  matchOver: false,
  winner: '',
};

function pointToTennis(p) {
  return ['0', '15', '30', '40'][p] || '40';
}

function getPointDisplay() {
  if (tennis.isTiebreak) {
    return tennis.playerTBPoints + ' - ' + tennis.opponentTBPoints;
  }
  var pp = tennis.playerPoints;
  var op = tennis.opponentPoints;
  if (pp >= 3 && op >= 3) {
    if (pp === op) return 'DEUCE';
    if (pp > op) return 'AD - 40';
    return '40 - AD';
  }
  return pointToTennis(pp) + ' - ' + pointToTennis(op);
}

function playerWinsPoint() {
  if (tennis.matchOver) return;
  if (tennis.isTiebreak) {
    tennis.playerTBPoints++;
    if (tennis.playerTBPoints >= 7 && tennis.playerTBPoints - tennis.opponentTBPoints >= 2) {
      playerWinsGame();
    }
    return;
  }
  tennis.playerPoints++;
  if (tennis.playerPoints >= 4 && tennis.playerPoints - tennis.opponentPoints >= 2) {
    playerWinsGame();
  }
}

function opponentWinsPoint() {
  if (tennis.matchOver) return;
  if (tennis.isTiebreak) {
    tennis.opponentTBPoints++;
    if (tennis.opponentTBPoints >= 7 && tennis.opponentTBPoints - tennis.playerTBPoints >= 2) {
      opponentWinsGame();
    }
    return;
  }
  tennis.opponentPoints++;
  if (tennis.opponentPoints >= 4 && tennis.opponentPoints - tennis.playerPoints >= 2) {
    opponentWinsGame();
  }
}

function playerWinsGame() {
  tennis.playerGames++;
  tennis.playerPoints = 0;
  tennis.opponentPoints = 0;
  tennis.isTiebreak = false;
  tennis.playerTBPoints = 0;
  tennis.opponentTBPoints = 0;
  addFloatingText('GAME - You!', '#44FF44', 28);
  if (tennis.playerGames >= 6 && tennis.playerGames - tennis.opponentGames >= 2) {
    tennis.matchOver = true;
    tennis.winner = 'player';
    gameState = 'matchover';
    totalWins++;
    addFloatingText('YOU WIN THE SET!', '#FFD700', 36);
    saveHighScores();
  } else if (tennis.playerGames === 6 && tennis.opponentGames === 6) {
    tennis.isTiebreak = true;
    addFloatingText('TIEBREAK!', '#FFD700', 32);
  }
}

function opponentWinsGame() {
  tennis.opponentGames++;
  tennis.playerPoints = 0;
  tennis.opponentPoints = 0;
  tennis.isTiebreak = false;
  tennis.playerTBPoints = 0;
  tennis.opponentTBPoints = 0;
  addFloatingText('GAME - Opponent', '#FF4444', 28);
  if (tennis.opponentGames >= 6 && tennis.opponentGames - tennis.playerGames >= 2) {
    tennis.matchOver = true;
    tennis.winner = 'opponent';
    gameState = 'matchover';
    addFloatingText('OPPONENT WINS', '#FF4444', 36);
    saveHighScores();
  } else if (tennis.playerGames === 6 && tennis.opponentGames === 6) {
    tennis.isTiebreak = true;
    addFloatingText('TIEBREAK!', '#FFD700', 32);
  }
}

function resetMatch() {
  tennis.playerPoints = 0;
  tennis.opponentPoints = 0;
  tennis.playerGames = 0;
  tennis.opponentGames = 0;
  tennis.isTiebreak = false;
  tennis.playerTBPoints = 0;
  tennis.opponentTBPoints = 0;
  tennis.matchOver = false;
  tennis.winner = '';
  rallyCount = 0;
  bestRally = 0;
}

// ================================================================
// SESSION 6: VISUAL POLISH
//
// Particles, screen shake, floating text, menu screen, and
// player idle animation to make the game feel professional.
// ================================================================

// --- PARTICLES ---
// Small colourful dots that burst from the ball on hit.
// Each particle has a position, velocity, colour, and lifespan.
var particles = [];

function spawnHitParticles(worldX, worldDepth) {
  // Create 12 particles spraying outward from the hit point
  for (var i = 0; i < 12; i++) {
    var angle = Math.random() * Math.PI * 2;  // Random direction
    var speed = 1.5 + Math.random() * 3;       // Random speed
    particles.push({
      x: worldX,
      depth: worldDepth,
      screenX: 0,       // Will be calculated from world position
      screenY: 0,
      vx: Math.cos(angle) * speed,   // Horizontal velocity
      vy: Math.sin(angle) * speed,   // Vertical velocity (screen space)
      life: 1.0,         // 1.0 = fully alive, fades to 0
      decay: 0.02 + Math.random() * 0.02,  // How fast it fades
      size: 2 + Math.random() * 3,
      color: ['#FFD700', '#FF6B6B', '#7FFF00', '#00BFFF', '#FF69B4'][Math.floor(Math.random() * 5)],
    });
  }
}

function updateParticles() {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.screenX += p.vx;   // Move in screen space
    p.screenY += p.vy;
    p.vy += 0.15;         // Gravity pulls particles down
    p.life -= p.decay;    // Fade out
    if (p.life <= 0) {
      particles.splice(i, 1);  // Remove dead particles
    }
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    // First particle uses world position, rest use screen offsets
    var basePos = projectToScreen(p.x, p.depth);
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(basePos.x + p.screenX, basePos.y + p.screenY, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- SCREEN SHAKE ---
// A brief camera shake on powerful hits. Makes impacts feel heavy.
var screenShake = {
  intensity: 0,     // How much the screen is shaking (0 = none)
  decay: 0.85,      // How fast the shake fades (0.85 = quick fade)
  offsetX: 0,       // Current horizontal offset
  offsetY: 0,       // Current vertical offset
};

function triggerScreenShake(power) {
  screenShake.intensity = power;  // Typically 4-8 pixels
}

function updateScreenShake() {
  if (screenShake.intensity > 0.5) {
    // Random offset within the intensity range
    screenShake.offsetX = (Math.random() - 0.5) * screenShake.intensity * 2;
    screenShake.offsetY = (Math.random() - 0.5) * screenShake.intensity * 2;
    // Decay the intensity
    screenShake.intensity *= screenShake.decay;
  } else {
    screenShake.intensity = 0;
    screenShake.offsetX = 0;
    screenShake.offsetY = 0;
  }
}

// --- FLOATING TEXTS ---
// Score popups that float upward and fade out ("+10", "MISSED!")
var floatingTexts = [];

function addFloatingText(text, color, size) {
  floatingTexts.push({
    text: text,
    color: color,
    size: size || 28,
    y: canvas.height * 0.4,   // Starts at 40% down the screen
    alpha: 1.0,                // Fully visible
    vy: -1.2,                  // Floats upward
  });
}

function updateFloatingTexts() {
  for (var i = floatingTexts.length - 1; i >= 0; i--) {
    var ft = floatingTexts[i];
    ft.y += ft.vy;         // Move up
    ft.alpha -= 0.012;     // Fade out
    if (ft.alpha <= 0) {
      floatingTexts.splice(i, 1);
    }
  }
}

function drawFloatingTexts() {
  for (var i = 0; i < floatingTexts.length; i++) {
    var ft = floatingTexts[i];
    ctx.globalAlpha = ft.alpha;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold ' + ft.size + 'px sans-serif';
    ctx.textAlign = 'center';
    // Shadow for readability
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.strokeText(ft.text, canvas.width / 2, ft.y);
    ctx.fillText(ft.text, canvas.width / 2, ft.y);
  }
  ctx.globalAlpha = 1;
}

// --- STATS (saved between sessions) ---
var totalWins = 0;
var highRally = 0;
try {

    }
    localStorage.setItem('tennisWins', totalWins.toString());

// --- OPPONENT CONSECUTIVE MISS TRACKER ---
var opponentConsecutiveMisses = 0;  // How many times in a row they've missed
var MAX_CONSECUTIVE_MISSES = 3;     // Don't let them miss more than 3 in a row

// ================================================================
// SESSION 3: PLAYER CONTROLS & HIT DETECTION
//
// The player object tracks where your character is on the court,
// whether they're swinging, and the swing animation state.
// ================================================================

// --- PLAYER OBJECT ---
var player = {
  x: 0,              // Left/right position on court (-1 to +1)
  targetX: 0,        // Where the player is moving toward
  speed: 0.03,       // How fast the player slides left/right
  swinging: false,    // Is the player currently swinging?
  swingTimer: 0,      // Counts down during the swing animation
  swingDirection: 0,  // -1 = swung left, 0 = center, +1 = swung right
};

// --- HIT DETECTION SETTINGS ---
// The "hit zone" is the range of depth values where the ball
// is close enough for you to reach it with your racket.
var HIT_ZONE_MIN = -0.05;   // Ball can be slightly past you (generous)
var HIT_ZONE_MAX = 0.18;    // Ball can be further away and still hittable
var HIT_REACH = 0.8;        // Wide horizontal reach so you don't miss side shots

// --- INPUT STATE ---
// We track the most recent tap so the update function can check it.
var lastTapTime = 0;         // When the player last tapped (in ms)
var lastTapX = 0.5;          // Where they tapped (0 = left edge, 1 = right edge)
var tapConsumed = true;      // Has the tap been used for a hit already?

// ================================================================
// SESSION 4: AI OPPONENT
//
// The opponent follows three simple rules:
//   Rule 1 — Track the ball (move toward where it's heading)
//   Rule 2 — Reaction delay (don't react instantly)
//   Rule 3 — Return aim (hit it back with semi-random direction)
//
// Difficulty scales with rally count — longer rallies = harder AI.
// ================================================================

// --- OPPONENT OBJECT ---
var opponent = {
  x: 0,                  // Left/right position (-1 to +1)
  speed: 0.015,          // Base movement speed (slower than player)
  reactionTimer: 0,      // Countdown before AI starts moving
  reacting: false,       // Has the AI started reacting to the ball?
  swinging: false,       // Is the opponent currently swinging?
  swingTimer: 0,         // Swing animation countdown
  swingDirection: 0,     // Which way the racket swings
  hitReach: 0.35,        // How far they can reach — reasonable but not magical
};

// --- AI DIFFICULTY SETTINGS ---
// These functions return values that scale with the rally count.
// The longer the rally, the harder the AI becomes.
//
// Misses happen NATURALLY when the ball is aimed far from the
// opponent and they can't move fast enough to reach it.
// You beat the AI by placing your shots well, not by luck.

// How fast the AI moves (gets faster as rally goes on)
function getAISpeed() {
  return 0.012 + Math.min(rallyCount * 0.001, 0.013);
  // Starts at 0.012, maxes out at 0.025 after ~13 rallies
}

// How long before the AI reacts (gets shorter as rally goes on)
function getAIReactionDelay() {
  var base = 35;  // 35 frames = ~0.58 seconds at the start
  var reduction = Math.min(rallyCount * 2, 20);  // Lose up to 20 frames
  return Math.max(12, base - reduction);
  // Starts at 35 frames, minimum 12 frames (~0.2 seconds)
}

// No more artificial miss chance — the AI only misses when it
// physically can't reach the ball in time. This was removed because
// it felt unfair and unrealistic.

// ================================================================
// SERVE FUNCTION
//
// Resets the ball and launches it from the opponent toward you.
// The ball starts at the far end (depth ~0.5) and travels toward
// you with an upward arc.
// ================================================================
function serve() {
  ball.x = opponent.x;                        // Starts at opponent's current position
  ball.y = 0.15;                            // Racket height (same level as opponent)
  ball.depth = 0.50;                        // Opponent's depth position
  ball.vx = (Math.random() - 0.5) * 0.006; // Slight random left/right aim
  ball.vy = 0.02;                           // Small upward arc from the hit
  ball.vDepth = -0.01;                      // Heading toward you
  ball.active = true;
  ball.trail = [];                          // Clear old trail
  gameState = 'playing';
  rallyCount = 0;                           // Reset rally counter
  player.x = 0;                             // Reset player to center
}

// ================================================================
// INPUT HANDLING
//
// We listen for tap (touchstart) and click events on the canvas.
// When the player taps, we record WHERE they tapped and WHEN.
// The game update function then checks if the tap was timed right
// to hit the ball.
//
// Where the player taps determines the shot direction:
//   Left side of screen  → ball goes to opponent's right
//   Right side of screen → ball goes to opponent's left
//   Center              → ball goes straight
// ================================================================

// Handle touch events (mobile phones)
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (paused) return;

  // Menu screen — start a new match
  if (gameState === 'menu') {
    resetMatch();
    gameState = 'serving';
    serveTimer = 60;
    return;
  }

  // Match over — tap to go back to menu
  if (gameState === 'matchover') {
    gameState = 'menu';
    return;
  }

  var touch = e.touches[0];
  lastTapTime = Date.now();
  lastTapX = touch.clientX / canvas.width;
  tapConsumed = false;
});

canvas.addEventListener('click', function(e) {
  if (paused) return;

  if (gameState === 'menu') {
    resetMatch();
    gameState = 'serving';
    serveTimer = 60;
    return;
  }

  if (gameState === 'matchover') {
    gameState = 'menu';
    return;
  }

  lastTapTime = Date.now();
  lastTapX = e.clientX / canvas.width;
  tapConsumed = false;
});

// --- PAUSE BUTTON ---
var pauseBtn = document.getElementById('pause-btn');
pauseBtn.addEventListener('click', function(e) {
  e.stopPropagation();  // Don't let this tap also move the player
  togglePause();
});
pauseBtn.addEventListener('touchstart', function(e) {
  e.stopPropagation();
  e.preventDefault();
  togglePause();
});

function togglePause() {
  if (gameState === 'menu') return;  // Can't pause on menu
  paused = !paused;
  pauseBtn.textContent = paused ? '▶' : '⏸';
}

// ================================================================
// PLAYER MOVEMENT UPDATE
//
// The player automatically slides toward where the ball will land.
// You don't control movement directly — only the swing timing
// and direction. This keeps controls simple: one tap does everything.
// ================================================================
function updatePlayer() {
  // --- AUTO-MOVE TOWARD THE BALL ---
  // If the ball is heading toward you (negative vDepth), move
  // to where it is horizontally so you're in position to hit it.
  if (ball.active && ball.vDepth < 0) {
    player.targetX = ball.x;
  }

  // Smoothly slide toward the target position
  var diff = player.targetX - player.x;
  if (Math.abs(diff) > 0.01) {
    // Move toward target, but limited by player speed
    player.x += Math.sign(diff) * Math.min(Math.abs(diff), player.speed);
  }

  // Keep player within court boundaries
  if (player.x < -0.85) player.x = -0.85;
  if (player.x > 0.85) player.x = 0.85;

  // --- SWING ANIMATION TIMER ---
  // The swing lasts about 15 frames (0.25 seconds).
  // Count it down each frame.
  if (player.swinging) {
    player.swingTimer--;
    if (player.swingTimer <= 0) {
      player.swinging = false;
    }
  }
}

// ================================================================
// HIT DETECTION
//
// Checks if the player tapped at the right moment to hit the ball.
// Two conditions must BOTH be true:
//   1. The ball is in the "hit zone" (close enough depth-wise)
//   2. The player tapped recently (within last 300ms)
//
// If both are true, we reverse the ball's direction and send it
// back toward the opponent.
// ================================================================
function checkHit() {
  if (!ball.active) return;
  if (tapConsumed) return;     // This tap was already used
  if (ball.vDepth > 0) return; // Ball is going away, can't hit it

  // Check if the ball is within the hit zone (close enough to you)
  var inHitZone = ball.depth >= HIT_ZONE_MIN && ball.depth <= HIT_ZONE_MAX;

  // Check if the tap was recent enough (within 300 milliseconds)
  var tapAge = Date.now() - lastTapTime;
  var tappedRecently = tapAge < 500;  // 500ms window — generous timing

  // Check if the ball is within horizontal reach of the player
  var horizontalDist = Math.abs(ball.x - player.x);
  var withinReach = horizontalDist < HIT_REACH;

  if (inHitZone && tappedRecently && withinReach) {
    // --- SUCCESSFUL HIT! ---

    // Mark the tap as used so we don't double-hit
    tapConsumed = true;

    // Calculate where the player aimed based on tap position.
    // lastTapX goes from 0 (left edge) to 1 (right edge).
    // We convert this to a court x value (-1 to +1).
    var aimX = (lastTapX - 0.5) * 2;  // -1 (left) to +1 (right)

    // Reverse the ball's direction — send it toward the opponent!
    ball.vDepth = 0.01 + Math.random() * 0.004;  // Speed toward far end
    ball.vx = aimX * 0.009;                       // Reduced aim power — keeps ball in court
    ball.vy = 0.025 + Math.random() * 0.01;      // Upward arc
    ball.trail = [];                               // Clear trail for fresh look

    // Trigger the swing animation
    player.swinging = true;
    player.swingTimer = 15;  // 15 frames = ~0.25 seconds
    player.swingDirection = aimX > 0 ? 1 : -1;  // Which way the racket swings

    // Increment the rally counter
    rallyCount++;
  }
}

// ================================================================
// OPPONENT AI UPDATE
//
// The AI follows three rules:
//
// Rule 1 — TRACK THE BALL: When the ball is heading toward the
//   opponent (vDepth > 0), the AI moves left/right toward where
//   the ball is. Movement speed is limited so corner shots can
//   beat the AI.
//
// Rule 2 — REACTION DELAY: When the ball first starts heading
//   toward the opponent (after you hit it), the AI waits a short
//   time before moving. This prevents the AI from being inhuman.
//
// Rule 3 — RETURN THE BALL: When the ball reaches the opponent's
//   depth (0.48-0.55) and they're close enough, they hit it back
//   with a semi-random aim. Sometimes they miss on purpose.
// ================================================================
function updateOpponent() {
  // Update the AI's movement speed based on difficulty
  opponent.speed = getAISpeed();

  // --- SWING ANIMATION TIMER ---
  if (opponent.swinging) {
    opponent.swingTimer--;
    if (opponent.swingTimer <= 0) {
      opponent.swinging = false;
    }
  }

  // Only run AI logic when the ball is active
  if (!ball.active) {
    // Return to center when no ball is in play
    var diffCenter = 0 - opponent.x;
    if (Math.abs(diffCenter) > 0.01) {
      opponent.x += Math.sign(diffCenter) * 0.01;
    }
    opponent.reacting = false;
    return;
  }

  // --- RULE 2: REACTION DELAY ---
  // When the ball starts heading toward the opponent, start
  // a reaction timer. The AI stands still until it expires.
  if (ball.vDepth > 0 && !opponent.reacting) {
    // Ball just started heading toward opponent — start countdown
    opponent.reactionTimer = getAIReactionDelay();
    opponent.reacting = true;
  }

  // If ball is heading away (toward you), reset reaction state
  if (ball.vDepth <= 0) {
    opponent.reacting = false;
  }

  // Count down the reaction timer
  if (opponent.reactionTimer > 0) {
    opponent.reactionTimer--;
    return;  // Don't move while still "reacting"
  }

  // --- RULE 1: TRACK THE BALL ---
  // Move toward the ball's x position, but limited by speed
  if (ball.vDepth > 0) {
    var diff = ball.x - opponent.x;
    if (Math.abs(diff) > 0.01) {
      opponent.x += Math.sign(diff) * Math.min(Math.abs(diff), opponent.speed);
    }
  }

  // Keep opponent within court boundaries
  if (opponent.x < -0.85) opponent.x = -0.85;
  if (opponent.x > 0.85) opponent.x = 0.85;

  // --- RULE 3: RETURN THE BALL ---
  // When the ball reaches the opponent's depth, attempt a return.
  if (ball.vDepth > 0 && ball.depth >= 0.46 && ball.depth <= 0.55) {
    var distToBall = Math.abs(opponent.x - ball.x);

    if (distToBall < opponent.hitReach) {
      // AI is close enough to hit — they WILL return it.
      // No artificial miss chance. The only way to score is to
      // place your shot where they can't reach it in time.

      // --- SUCCESSFUL AI RETURN ---
      // Reset the consecutive miss counter since they hit it
      opponentConsecutiveMisses = 0;

      // Aim semi-intelligently: 60% of the time aim away from the
      // player, 40% random
      var aimX;
      if (Math.random() < 0.6) {
        // Aim away from where the player is
        aimX = player.x > 0 ? -0.5 - Math.random() * 0.5 : 0.5 + Math.random() * 0.5;
      } else {
        // Random aim
        aimX = (Math.random() - 0.5) * 1.5;
      }

      // Reverse ball direction — send it back toward the player
      ball.vDepth = -0.009 - Math.random() * 0.004;  // Speed toward player
      ball.vx = aimX * 0.01;                          // Horizontal aim
      ball.vy = 0.02 + Math.random() * 0.01;         // Upward arc
      ball.trail = [];                                 // Clear trail

      // Trigger swing animation
      opponent.swinging = true;
      opponent.swingTimer = 12;
      opponent.swingDirection = aimX > 0 ? 1 : -1;

      // Increment rally
      rallyCount++;
    }
    // If distToBall >= hitReach, the AI simply can't reach it
    // and the ball will go past them (you score!)
  }
}

// ================================================================
// BALL PHYSICS UPDATE
//
// Called every frame (~60 times per second). Moves the ball,
// applies gravity, handles bouncing, and checks boundaries.
// ================================================================
function updateBall() {
  if (!ball.active) return;

  // --- MOVE THE BALL ---
  // Add velocity to position (this is how movement works in games:
  // position = position + speed, every single frame)
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.depth += ball.vDepth;

  // --- APPLY GRAVITY ---
  // Gravity pulls the ball downward by reducing vy each frame.
  // If vy is positive (going up), gravity slows it down.
  // If vy is zero, gravity starts pulling it down.
  // If vy is negative (falling), gravity makes it fall faster.
  ball.vy -= GRAVITY;

  // --- BOUNCE OFF THE GROUND ---
  // When the ball's height reaches 0 (ground level), it bounces.
  // We reverse vy (now going up) and multiply by BOUNCE_DAMPING
  // to simulate energy loss — each bounce is lower than the last.
  if (ball.y <= 0) {
    ball.y = 0;
    ball.vy = Math.abs(ball.vy) * BOUNCE_DAMPING;

    // If the bounce is too tiny, just stop vertical movement
    if (ball.vy < 0.003) {
      ball.vy = 0;
    }
  }

  // --- BALL WENT OFF COURT (past the sidelines) ---
  // If the ball goes out of bounds, the point ends.
  // Who gets the point depends on who hit it out:
  //   vDepth > 0 means the PLAYER hit it out → opponent scores
  //   vDepth < 0 means the OPPONENT hit it out → player scores
  if (ball.x < -1.05 || ball.x > 1.05) {
    ball.active = false;
    serveTimer = 90;
    if (rallyCount > bestRally) bestRally = rallyCount;
    saveHighScores();

    if (ball.vDepth > 0) {
      // Player hit it out — opponent gets the point
      gameState = 'out';
      addFloatingText('OUT!', '#FF8800', 32);
      opponentWinsPoint();
    } else {
      // Opponent hit it out — player gets the point
      gameState = 'scored';
      addFloatingText('OUT! Your point!', '#44FF44', 28);
      playerWinsPoint();
    }
  }

  // --- BALL REACHED YOUR END (depth <= 0) ---
  // You failed to return — opponent wins the point
  if (ball.depth <= -0.05) {
    ball.active = false;
    gameState = 'missed';
    serveTimer = 90;
    if (rallyCount > bestRally) bestRally = rallyCount;
    saveHighScores();
    addFloatingText('MISSED!', '#FF4444', 32);
    opponentWinsPoint();
  }

  // --- BALL REACHED FAR END (depth >= 1) ---
  // Opponent failed to return — you win the point!
  if (ball.depth >= 1.05) {
    ball.active = false;
    gameState = 'scored';
    serveTimer = 90;
    if (rallyCount > bestRally) bestRally = rallyCount;
    saveHighScores();
    addFloatingText('Your point!', '#44FF44', 32);
    playerWinsPoint();
  }

  // --- UPDATE THE TRAIL ---
  // Store the ball's current position for the speed trail effect.
  // We keep the last 8 positions. Old ones get removed.
  ball.trail.push({
    x: ball.x,
    y: ball.y,
    depth: ball.depth
  });
  if (ball.trail.length > 8) {
    ball.trail.shift();  // Remove the oldest position
  }
}

// ================================================================
// DRAW THE BALL SHADOW
//
// The shadow is drawn on the court surface (y = 0) directly
// below the ball. As the ball rises, the shadow stays on the
// ground — this is what makes the ball look like it's in the air.
//
// The shadow is a dark, semi-transparent oval. It gets smaller
// and more transparent as the ball gets higher (simulating how
// shadows work in real life — farther from the ground = softer).
// ================================================================
function drawBallShadow() {
  if (!ball.active) return;

  // Project the shadow position (same x and depth as ball, but y = 0)
  var shadowPos = projectToScreen(ball.x, ball.depth, 0);

  // Shadow gets fainter and smaller as ball goes higher
  var heightFade = Math.max(0.1, 1 - ball.y * 0.8);
  var shadowSize = (6 + 4 * shadowPos.scale) * heightFade;

  ctx.fillStyle = 'rgba(0, 0, 0, ' + (0.25 * heightFade) + ')';
  ctx.beginPath();
  ctx.ellipse(
    shadowPos.x,
    shadowPos.y + 2,     // Slightly below the ground point
    shadowSize * 1.5,    // Wider than tall (oval shape)
    shadowSize * 0.5,    // Flat oval
    0, 0, Math.PI * 2
  );
  ctx.fill();
}

// ================================================================
// DRAW THE BALL TRAIL
//
// A trail of fading circles behind the ball that creates a speed
// effect. Older positions are drawn smaller and more transparent.
// The trail makes the ball easier to track visually.
// ================================================================
function drawBallTrail() {
  if (!ball.active || ball.trail.length < 2) return;

  for (var i = 0; i < ball.trail.length; i++) {
    var t = ball.trail[i];
    var trailPos = projectToScreen(t.x, t.depth, t.y);

    // Older = more transparent and smaller
    // i/trail.length goes from 0 (oldest) to ~1 (newest)
    var fade = (i / ball.trail.length);
    var trailSize = (3 + 5 * trailPos.scale) * fade;

    ctx.fillStyle = 'rgba(200, 255, 0, ' + (fade * 0.3) + ')';
    ctx.beginPath();
    ctx.arc(trailPos.x, trailPos.y, Math.max(1, trailSize), 0, Math.PI * 2);
    ctx.fill();
  }
}

// ================================================================
// DRAW THE BALL
//
// The ball is drawn as a circle with a gradient to look 3D.
// Its size depends on depth — big when close, small when far.
// A small highlight gives it a shiny, spherical look.
// ================================================================
function drawBall() {
  if (!ball.active) return;

  // Project the ball's 3D position to 2D screen coordinates
  var pos = projectToScreen(ball.x, ball.depth, ball.y);

  // Ball size scales with depth (bigger when close)
  var radius = BALL_RADIUS_BASE * pos.scale + 3;

  // --- MAIN BALL (gradient for 3D look) ---
  var gradient = ctx.createRadialGradient(
    pos.x - radius * 0.3,   // Highlight offset (upper-left)
    pos.y - radius * 0.3,
    radius * 0.1,            // Inner radius (highlight center)
    pos.x,                   // Ball center
    pos.y,
    radius                   // Outer radius (ball edge)
  );
  gradient.addColorStop(0, '#E8FF6B');    // Bright yellow-green highlight
  gradient.addColorStop(0.4, '#C8E620');  // Tennis ball green-yellow
  gradient.addColorStop(1, '#8AAE10');    // Darker edge

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
  ctx.fill();

  // --- BALL SEAM LINE (the curved line on a tennis ball) ---
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.lineWidth = Math.max(0.5, radius * 0.12);
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, radius * 0.7, -0.8, 1.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, radius * 0.7, Math.PI - 0.8, Math.PI + 1.2);
  ctx.stroke();

  // --- SHINE HIGHLIGHT (small bright spot) ---
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.beginPath();
  ctx.arc(pos.x - radius * 0.25, pos.y - radius * 0.25, radius * 0.25, 0, Math.PI * 2);
  ctx.fill();
}

// ================================================================
// GAME UPDATE — called every frame before drawing
//
// This handles all game logic in order:
//   1. Serve timer (countdown between points)
//   2. Player movement (auto-track the ball)
//   3. Ball physics (move, gravity, bounce)
//   4. Hit detection (did the player hit the ball?)
// ================================================================
function update() {
  gameTimer++;

  // Handle the serve timer
  if (!tennis.matchOver && (gameState === 'serving' || gameState === 'missed' || gameState === 'scored' || gameState === 'out')) {
    serveTimer--;
    if (serveTimer <= 0) {
      serve();
    }
  }

  updatePlayer();
  updateOpponent();
  updateBall();
  checkHit();

  // Update visual effects
  updateFloatingTexts();
}

// ================================================================
// DRAW PLAYER — realistic tennis player at the near baseline
//
// Proper proportions: head, neck, shoulders, torso, shorts,
// muscular legs, tennis shoes, detailed racket, and shading.
// ================================================================
function drawPlayer() {
  // Use the player's current x position (moves left/right to track ball)
  var pos = projectToScreen(player.x, 0.05);
  var px = pos.x;
  var py = pos.y;     // py = feet position (ground level)

  // --- SWING ANIMATION ---
  // When swinging, the racket arm rotates. swingProgress goes
  // from 1 (start of swing) to 0 (end of swing).
  var swingProgress = 0;
  var swingAngle = 0;
  if (player.swinging) {
    swingProgress = player.swingTimer / 15;  // 1 → 0 over 15 frames
    // The swing goes: wind up → hit → follow through
    // We use a sine curve to make it smooth
    swingAngle = Math.sin(swingProgress * Math.PI) * 1.8 * player.swingDirection;
  }

  // --- SHADOW on the court ---
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(px, py + 2, 28, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // --- SHOES ---
  // Left shoe
  ctx.fillStyle = '#E8E8E8';
  ctx.beginPath();
  ctx.ellipse(px - 10, py - 1, 8, 4, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1565C0';  // Blue sole accent
  ctx.fillRect(px - 17, py - 1, 14, 2);
  // Right shoe
  ctx.fillStyle = '#E8E8E8';
  ctx.beginPath();
  ctx.ellipse(px + 10, py - 1, 8, 4, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1565C0';
  ctx.fillRect(px + 3, py - 1, 14, 2);

  // --- LEGS (slightly bent, athletic stance) ---
  // Left leg - shin
  ctx.strokeStyle = '#D4A06A';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px - 10, py - 3);
  ctx.lineTo(px - 8, py - 20);
  ctx.stroke();
  // Left leg - thigh
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(px - 8, py - 20);
  ctx.lineTo(px - 5, py - 35);
  ctx.stroke();
  // Right leg - shin
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(px + 10, py - 3);
  ctx.lineTo(px + 9, py - 20);
  ctx.stroke();
  // Right leg - thigh
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(px + 9, py - 20);
  ctx.lineTo(px + 5, py - 35);
  ctx.stroke();

  // --- SHORTS (white with dark trim) ---
  ctx.fillStyle = '#F5F5F5';
  ctx.beginPath();
  ctx.moveTo(px - 14, py - 35);
  ctx.lineTo(px - 12, py - 22);
  ctx.lineTo(px + 12, py - 22);
  ctx.lineTo(px + 14, py - 35);
  ctx.closePath();
  ctx.fill();
  // Shorts waistband
  ctx.fillStyle = '#333';
  ctx.fillRect(px - 14, py - 36, 28, 3);

  // --- TORSO (white polo shirt with shading) ---
  // Main shirt body
  ctx.fillStyle = '#FAFAFA';
  ctx.beginPath();
  ctx.moveTo(px - 14, py - 36);   // Bottom left
  ctx.lineTo(px - 16, py - 55);   // Left shoulder
  ctx.quadraticCurveTo(px, py - 60, px + 16, py - 55);  // Shoulder curve
  ctx.lineTo(px + 14, py - 36);   // Bottom right
  ctx.closePath();
  ctx.fill();

  // Shirt shadow (left side for depth)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.beginPath();
  ctx.moveTo(px - 14, py - 36);
  ctx.lineTo(px - 16, py - 55);
  ctx.lineTo(px - 2, py - 57);
  ctx.lineTo(px - 2, py - 36);
  ctx.closePath();
  ctx.fill();

  // Back of collar (raised collar rim seen from behind)
  ctx.fillStyle = '#E0E0E0';
  ctx.beginPath();
  ctx.moveTo(px - 7, py - 57);
  ctx.quadraticCurveTo(px, py - 59, px + 7, py - 57);
  ctx.lineTo(px + 6, py - 55);
  ctx.quadraticCurveTo(px, py - 57, px - 6, py - 55);
  ctx.closePath();
  ctx.fill();
  // Collar shadow
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px - 6, py - 55);
  ctx.quadraticCurveTo(px, py - 57, px + 6, py - 55);
  ctx.stroke();

  // --- NECK ---
  ctx.fillStyle = '#D4A06A';
  ctx.fillRect(px - 3, py - 62, 6, 6);

  // --- HEAD (BACK VIEW — we are behind the player) ---

  // Base head shape (skin visible at sides/bottom)
  ctx.fillStyle = '#DEAD85';
  ctx.beginPath();
  ctx.ellipse(px, py - 70, 9, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ears (poking out from sides, seen from behind)
  ctx.fillStyle = '#D4A06A';
  ctx.beginPath();
  ctx.ellipse(px - 9.5, py - 69, 2.5, 3.5, -0.15, 0, Math.PI * 2);
  ctx.fill();
  // Inner ear shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.beginPath();
  ctx.ellipse(px - 9.5, py - 69, 1.5, 2.5, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#D4A06A';
  ctx.beginPath();
  ctx.ellipse(px + 9.5, py - 69, 2.5, 3.5, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.beginPath();
  ctx.ellipse(px + 9.5, py - 69, 1.5, 2.5, 0.15, 0, Math.PI * 2);
  ctx.fill();

  // Hair covering the entire back of the head
  ctx.fillStyle = '#2C1810';
  ctx.beginPath();
  ctx.ellipse(px, py - 70, 10, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hair texture lines (subtle strands running downward)
  ctx.strokeStyle = '#1A0F08';
  ctx.lineWidth = 0.5;
  for (var h = -4; h <= 4; h++) {
    ctx.beginPath();
    ctx.moveTo(px + h * 2, py - 80);
    ctx.quadraticCurveTo(px + h * 2.3, py - 70, px + h * 2.5, py - 61);
    ctx.stroke();
  }

  // Hairline at the nape of the neck (tapered edge)
  ctx.fillStyle = '#2C1810';
  ctx.beginPath();
  ctx.moveTo(px - 5, py - 61);
  ctx.quadraticCurveTo(px, py - 58, px + 5, py - 61);
  ctx.lineTo(px + 7, py - 63);
  ctx.lineTo(px - 7, py - 63);
  ctx.closePath();
  ctx.fill();

  // Red headband (wrapped around the head, seen from behind)
  ctx.fillStyle = '#D32F2F';
  ctx.beginPath();
  ctx.ellipse(px, py - 73, 10.5, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Headband knot at the back (the tied ends hanging down)
  ctx.fillStyle = '#B71C1C';
  ctx.beginPath();
  ctx.moveTo(px - 2, py - 70);
  ctx.lineTo(px - 5, py - 64);
  ctx.lineTo(px - 3, py - 64);
  ctx.lineTo(px, py - 70);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px + 2, py - 70);
  ctx.lineTo(px + 5, py - 64);
  ctx.lineTo(px + 3, py - 64);
  ctx.lineTo(px, py - 70);
  ctx.closePath();
  ctx.fill();

  // --- LEFT ARM (non-racket hand, bent in ready position) ---
  // Upper arm
  ctx.strokeStyle = '#D4A06A';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px - 16, py - 53);
  ctx.lineTo(px - 24, py - 42);
  ctx.stroke();
  // Forearm
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(px - 24, py - 42);
  ctx.lineTo(px - 18, py - 34);
  ctx.stroke();
  // Hand
  ctx.fillStyle = '#DEAD85';
  ctx.beginPath();
  ctx.arc(px - 18, py - 33, 3, 0, Math.PI * 2);
  ctx.fill();

  // --- RIGHT ARM + RACKET (animated swing) ---
  // We use ctx.save/restore and ctx.rotate to swing the arm.
  // The rotation happens around the shoulder joint.
  ctx.save();  // Save the current canvas state

  // Move the canvas origin to the shoulder joint
  // (all rotation happens around this point)
  ctx.translate(px + 16, py - 53);

  // Apply swing rotation (swingAngle is 0 when idle)
  ctx.rotate(swingAngle);

  // Now draw the arm relative to the shoulder (which is at 0,0)
  // Upper arm
  ctx.strokeStyle = '#D4A06A';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);           // Shoulder (origin after translate)
  ctx.lineTo(10, 9);          // Elbow
  ctx.stroke();
  // Forearm
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(10, 9);          // Elbow
  ctx.lineTo(19, 1);          // Wrist
  ctx.stroke();
  // Hand
  ctx.fillStyle = '#DEAD85';
  ctx.beginPath();
  ctx.arc(19, 1, 3, 0, Math.PI * 2);
  ctx.fill();

  // --- RACKET (attached to the hand) ---
  // Handle
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(19, 1);
  ctx.lineTo(26, -9);
  ctx.stroke();

  // Racket head frame
  ctx.strokeStyle = '#C62828';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(31, -19, 9, 14, 0.2, 0, Math.PI * 2);
  ctx.stroke();

  // Inner frame
  ctx.strokeStyle = '#E53935';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(31, -19, 7, 12, 0.2, 0, Math.PI * 2);
  ctx.stroke();

  // Strings - vertical
  ctx.strokeStyle = 'rgba(220, 220, 220, 0.6)';
  ctx.lineWidth = 0.4;
  for (var sv = -4; sv <= 4; sv++) {
    ctx.beginPath();
    ctx.moveTo(31 + sv * 1.5, -32);
    ctx.lineTo(31 + sv * 1.5, -6);
    ctx.stroke();
  }
  // Strings - horizontal
  for (var sh = -6; sh <= 6; sh++) {
    ctx.beginPath();
    ctx.moveTo(23, -19 + sh * 1.8);
    ctx.lineTo(39, -19 + sh * 1.8);
    ctx.stroke();
  }

  ctx.restore();  // Restore canvas state (removes the rotation)
}

// ================================================================
// DRAW HIT FLASH
//
// A brief bright flash when the player hits the ball.
// Makes the hit feel satisfying and impactful.
// ================================================================
function drawHitFlash() {
  if (player.swinging && player.swingTimer > 10) {
    // Flash is strongest in the first few frames of the swing
    var flashIntensity = (player.swingTimer - 10) / 5;
    ctx.fillStyle = 'rgba(255, 255, 200, ' + (flashIntensity * 0.15) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

// ================================================================
// DRAW RALLY COUNTER
//
// Shows the current rally count in the top center of the screen.
// Only appears during active play (not during serving pauses).
// ================================================================
function drawHUD() {
  var W = canvas.width;

  // ============================================================
  // TENNIS SCOREBOARD (top-left)
  //
  // Shows: Games (e.g. "3 - 2") and current point (e.g. "30 - 15")
  // In tiebreak, shows tiebreak points instead
  // ============================================================

  // Background box
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.beginPath();
  ctx.roundRect(10, 8, 180, 58, 10);
  ctx.fill();

  // "Games" label and score
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('GAMES', 20, 22);

  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText('You ' + tennis.playerGames + ' - ' + tennis.opponentGames + ' Opp', 20, 38);

  // Current point score
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 14px sans-serif';
  var pointText = tennis.isTiebreak ? 'TB: ' + getPointDisplay() : getPointDisplay();
  ctx.fillText(pointText, 20, 56);

  // Tiebreak indicator
  if (tennis.isTiebreak) {
    ctx.fillStyle = '#FF6B6B';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText('TIEBREAK', 130, 22);
  }

  // --- RALLY COUNTER (top center) ---
  if (gameState === 'playing' && rallyCount > 0) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.roundRect(W / 2 - 45, 8, 90, 32, 16);
    ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Rally: ' + rallyCount, W / 2, 30);
  }

  // --- BEST RALLY (top center, below rally) ---
  if (bestRally > 0 || highRally > 0) {
    var br = Math.max(bestRally, highRally);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.roundRect(W / 2 - 50, 46, 100, 24, 8);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Best rally: ' + br, W / 2, 62);
  }
}

// ================================================================
// MATCH OVER SCREEN
// ================================================================
function drawMatchOver() {
  var W = canvas.width;
  var H = canvas.height;

  // Draw the game underneath
  drawBackground();
  drawOpponent();
  drawPlayer();

  // Dark overlay
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, 0, W, H);

  // Result
  if (tennis.winner === 'player') {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold ' + Math.min(W * 0.07, 40) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('YOU WIN!', W / 2, H * 0.28);
  } else {
    ctx.fillStyle = '#FF4444';
    ctx.font = 'bold ' + Math.min(W * 0.07, 40) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('YOU LOSE', W / 2, H * 0.28);
  }

  // Final score
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold ' + Math.min(W * 0.05, 28) + 'px sans-serif';
  ctx.fillText(tennis.playerGames + ' - ' + tennis.opponentGames, W / 2, H * 0.40);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.font = Math.min(W * 0.03, 16) + 'px sans-serif';
  ctx.fillText('Games', W / 2, H * 0.46);

  // Best rally
  if (bestRally > 0) {
    ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
    ctx.font = Math.min(W * 0.03, 15) + 'px sans-serif';
    ctx.fillText('Best Rally: ' + bestRally, W / 2, H * 0.56);
  }

  // Play again prompt
  var pulse = 0.4 + Math.sin(Date.now() * 0.005) * 0.6;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold ' + Math.min(W * 0.04, 22) + 'px sans-serif';
  ctx.fillText('TAP TO PLAY AGAIN', W / 2, H * 0.72);
  ctx.globalAlpha = 1;
}

// ================================================================
// PAUSE OVERLAY
//
// Dark semi-transparent overlay with "PAUSED" text and instructions.
// Drawn on top of the frozen game when paused.
// ================================================================
function drawPauseOverlay() {
  var W = canvas.width;
  var H = canvas.height;

  // Dark overlay
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(0, 0, W, H);

  // "PAUSED" text
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W / 2, H * 0.4);

  // Resume instruction
  var pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
  ctx.fillStyle = 'rgba(255, 255, 255, ' + pulse + ')';
  ctx.font = '18px sans-serif';
  ctx.fillText('Tap ▶ to resume', W / 2, H * 0.5);

  // Stats while paused
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.font = '14px sans-serif';
  ctx.fillText('Games: You ' + tennis.playerGames + ' - ' + tennis.opponentGames + ' Opp  |  Best Rally: ' + Math.max(bestRally, highRally), W / 2, H * 0.62);
  ctx.fillText('Wins: ' + totalWins, W / 2, H * 0.68);
}

// ================================================================
// MENU SCREEN — shown when the game first loads
// ================================================================
function drawMenu() {
  var W = canvas.width;
  var H = canvas.height;

  drawBackground();

  // Dark overlay
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold ' + Math.min(W * 0.07, 44) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TENNIS RALLY', W / 2, H * 0.32);

  // Subtitle
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.font = Math.min(W * 0.03, 16) + 'px sans-serif';
  ctx.fillText('Tap left or right to aim your shots', W / 2, H * 0.40);

  // Animated bouncing ball
  var bounce = Math.abs(Math.sin(Date.now() * 0.004)) * 20;
  ctx.fillStyle = '#C8E620';
  ctx.beginPath();
  ctx.arc(W / 2, H * 0.52 - bounce, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(W / 2, H * 0.54, 10 + bounce * 0.2, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // "Tap to Play" (pulsing)
  var pulse = 0.4 + Math.sin(Date.now() * 0.005) * 0.6;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold ' + Math.min(W * 0.045, 24) + 'px sans-serif';
  ctx.fillText('TAP TO PLAY', W / 2, H * 0.70);
  ctx.globalAlpha = 1;

  // Stats
  if (totalWins > 0 || highRally > 0) {
    ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
    ctx.font = Math.min(W * 0.03, 15) + 'px sans-serif';
    ctx.fillText('Wins: ' + totalWins + '  |  Best Rally: ' + highRally, W / 2, H * 0.82);
  }

  // Hint
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.font = Math.min(W * 0.025, 12) + 'px sans-serif';
  ctx.fillText('Aim to the corners to beat the opponent', W / 2, H * 0.92);
}

// ================================================================
// MAIN DRAW — with screen shake
// ================================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground();
  drawBallShadow();
  drawBallTrail();
  drawOpponent();
  drawBall();
  drawPlayer();

  // UI layers on top
  drawHitFlash();
  drawFloatingTexts();
  drawHUD();
}

// ================================================================
// ORIENTATION CHECK
// ================================================================
function isPortrait() { return window.innerHeight > window.innerWidth; }

function drawRotateMessage() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Please rotate your phone', canvas.width / 2, canvas.height / 2 - 15);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '16px sans-serif';
  ctx.fillText('This game is played in landscape mode', canvas.width / 2, canvas.height / 2 + 20);
}

// ================================================================
// GAME LOOP — handles menu, pause, and gameplay
// ================================================================
function startGameLoop() {
  function loop() {
    resizeCanvas();
    if (isPortrait()) {
      drawRotateMessage();
    } else if (gameState === 'menu') {
      drawMenu();
    } else if (gameState === 'matchover') {
      updateFloatingTexts();
      drawMatchOver();
      drawFloatingTexts();
    } else if (paused) {
      draw();
      drawPauseOverlay();
    } else {
      update();
      draw();
    }
    requestAnimationFrame(loop);
  }
  loop();
}

// ================================================================
// REGISTER SERVICE WORKER (enables offline play)
//
// The service worker caches all game files after the first load.
// After that, the game works even without internet.
// ================================================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function() {
    console.log('Service worker registered — game works offline!');
  }).catch(function(err) {
    console.log('Service worker not registered:', err);
  });
}

</script>
